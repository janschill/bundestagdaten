name: publish

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [download]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      # the download workflow maintains the protocol cache; publish only reads it
      - uses: actions/cache/restore@v4
        with:
          path: data/protocols
          key: protocols-
          restore-keys: |
            protocols-

      - name: Download protocols (fallback when the cache is empty)
        run: |
          if [ -z "$(ls -A data/protocols 2>/dev/null)" ]; then
            uv run scripts/download_protocols.py 21
          fi

      - run: uv run scripts/export_json.py

      # pushes with GITHUB_TOKEN don't retrigger this workflow, so no loop
      - name: Commit updated data
        run: |
          if [ -n "$(git status --porcelain site/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Update data ($(date -u +%F))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

name: publish

on:
  schedule:
    - cron: "0 6 * * *" # protocols appear a day or two after sittings
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync

      # raw XMLs are never committed; the cache carries them between runs and
      # the download script only fetches what is missing
      - uses: actions/cache@v4
        with:
          path: data/protocols
          key: protocols-${{ github.run_id }}
          restore-keys: |
            protocols-

      - run: uv run scripts/download_protocols.py 21

      - run: uv run scripts/export_json.py

      # pushes with GITHUB_TOKEN don't retrigger this workflow, so no loop
      - name: Commit updated data
        run: |
          if [ -n "$(git status --porcelain site/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data
            git commit -m "Update data ($(date -u +%F))"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
